{% extends "layout.html" %}

{% block main %}
    <h1>Edit Project</h1>

    <form action="/project/{{ project['id'] }}/edit" method="post">
        <input name="title" type="text" value="{{ project['title'] }}">

        <br><br>

        <textarea name="description">{{ project["description"] }}</textarea>

        <br><br>

        <button type="submit">Save Changes</button>
    </form>

    <p>
        <a href="/project/{{ project['id'] }}">Cancel</a>
    </p>



{% endblock %}
